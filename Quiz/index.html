<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="sec d-flex align-items-center justify-content-center">
        <div class="form-info shadow-lg p-4 rounded-4">

            <h2 class="text-center text-white fw-bold mb-4">Login</h2>

            <form>

                <div class="mb-3">
                    <label for="email" class="form-label text-white">Email address</label>
                    <input type="email" class="form-control custom-input" id="email"
                        placeholder="Enter your email">
                </div>

            
                <div class="mb-3">
                    <label for="password" class="form-label text-white">Password</label>
                    <input type="password" class="form-control custom-input" id="password"
                        placeholder="Enter your password">
                </div>


                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label text-white" for="exampleCheck1">
                        Remember me
                    </label>
                </div>

                <div class="d-grid">
                    <a href="Queations.html" class="btn btn-primary fw-bold" id="btn">
                        Sign In
                    </a>
                </div>
            </form>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
