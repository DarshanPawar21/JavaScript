<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="calculator-container">
      <!-- head -->
        <h2>EMI Calculator</h2>

        <div class="main-content">
            <div class="inputs-section">
                <div class="input-group">
                    <div class="label-row">
                        <label>Loan amount</label>
                        <span class="value-box">$ <input class="c1" type="number"  value="400000"></span>
                    </div>
                    <input class="t1" type="range"  min="100000" max="1000000" step="10000" value="400000">
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label>Rate of interest</label>
                        <span class="value-box"><input class="c1" type="number" value="5.4" step="0.1"> %</span>
                    </div>
                    <input class="t1" type="range" value="5.4">
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label>Loan tenure</label>
                        <span class="value-box"><input class="c1" type="number" value="7"> Yr</span>
                    </div>
                    <input class="t1" type="range"   value="7">
                </div>

                <div class="results-display">
                    <div class="result-item"><span>Monthly EMI</span>$5,729</div>
                    <div class="result-item"><span>Principal amount</span>$4,00,000</div>
                    <div class="result-item"><span>Total interest</span> $81,240</div>
                    <div class="result-item"><span>Total amount</span> $4,81,240</div>
                </div>
            </div>
        </div>


    </section>

    <script src="script.js"></script>
</body>
</html>
